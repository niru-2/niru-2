[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niru"
version = "0.1.0"
description = "Niru: a CLI assistant for natural-language system actions."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Niru Maintainer" }]
dependencies = [
  "yt-dlp>=2024.8.6"
]

[project.scripts]
niru = "niru.cli:main"

[tool.setuptools.packages.find]
include = ["niru*"]
